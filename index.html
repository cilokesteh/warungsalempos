<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Warung Salem</title>
    <script src="pwa.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha384-Yv5O+t3uE3hunW8uyrbpPW3iw6/5/Y7HitWJBLgqfMoA36NogMmy+8wWZMpn3HWc" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <div class="min-h-screen">
        <!-- Header -->
        <div class="bg-zinc-900 border-b border-zinc-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between">
                <div class="flex items-center gap-x-2 sm:gap-x-3">
                    <div class="w-9 h-9 sm:w-10 sm:h-10 bg-[#991b1b] rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-store text-white text-lg sm:text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-xl sm:text-2xl">Warung Salem</h1>
                        <p class="text-xs text-zinc-500 hidden sm:block">Point of Sale</p>
                    </div>
                </div>
                <div class="flex items-center gap-x-2 sm:gap-x-4">
                    <a href="./reports" class="px-3 sm:px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm flex items-center gap-x-1 sm:gap-x-2">
                        <i class="fa-solid fa-chart-bar"></i>
                        <span class="hidden sm:inline">Laporan</span>
                    </a>
                    <div class="hidden sm:flex px-4 py-1.5 bg-zinc-800 rounded-full text-sm items-center gap-x-2">
                        <i class="fa-solid fa-user text-[#b91c1c]"></i>
                        <span id="admin-name">Admin</span>
                    </div>
                    <button onclick="logout()" class="px-3 sm:px-4 py-2 bg-red-600 hover:bg-red-700 rounded-xl text-sm flex items-center gap-x-1 sm:gap-x-2 transition-colors">
                        <i class="fa-solid fa-sign-out-alt"></i>
                        <span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 sm:py-8">
            <!-- Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-6 sm:mb-8">
                <div class="bg-zinc-900 rounded-2xl p-4 sm:p-5 border border-zinc-800">
                    <div class="text-zinc-400 text-xs sm:text-sm">Total Produk</div>
                    <div class="text-2xl sm:text-3xl font-bold mt-1" id="total-products">0</div>
                </div>
                <div class="bg-zinc-900 rounded-2xl p-4 sm:p-5 border border-zinc-800">
                    <div class="text-zinc-400 text-xs sm:text-sm">Transaksi Hari Ini</div>
                    <div class="text-2xl sm:text-3xl font-bold mt-1" id="today-transactions">0</div>
                </div>
                <div class="bg-zinc-900 rounded-2xl p-4 sm:p-5 border border-zinc-800">
                    <div class="text-zinc-400 text-xs sm:text-sm">Pendapatan Hari Ini</div>
                    <div class="text-2xl sm:text-3xl font-bold mt-1 text-[#b91c1c]" id="today-revenue">Rp 0</div>
                </div>
                <div class="bg-zinc-900 rounded-2xl p-4 sm:p-5 border border-zinc-800">
                    <div class="text-zinc-400 text-xs sm:text-sm">Stok Menipis (&lt; 5)</div>
                    <div class="text-2xl sm:text-3xl font-bold mt-1 text-amber-400" id="low-stock">0</div>
                    <div id="low-stock-list" class="mt-2 space-y-1 text-xs text-zinc-400 max-h-32 overflow-auto"></div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
                
                <!-- Product List -->
                <div class="lg:col-span-5 bg-zinc-900 rounded-3xl border border-zinc-800 p-4 sm:p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-semibold text-lg">Daftar Produk</h2>
                        <button onclick="showProductModal()" class="px-4 py-2 bg-[#800000] hover:bg-[#600000] rounded-2xl text-sm flex items-center gap-x-2 transition-colors">
                            <i class="fa-solid fa-plus"></i>
                            <span>Tambah</span>
                        </button>
                    </div>

                    <div class="mb-3">
                        <input type="text" id="search-product" placeholder="Cari produk..." 
                               class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-[#800000]"
                               onkeyup="filterProducts()">
                    </div>

                    <div class="flex gap-2 mb-4 overflow-x-auto">
                        <button onclick="setCategoryFilter('all')" class="category-tab px-4 py-2 bg-[#800000] rounded-2xl text-xs" data-category="all">Semua</button>
                        <button onclick="setCategoryFilter('Makanan')" class="category-tab px-4 py-2 bg-zinc-800 rounded-2xl text-xs" data-category="Makanan">Makanan</button>
                        <button onclick="setCategoryFilter('Cemilan')" class="category-tab px-4 py-2 bg-zinc-800 rounded-2xl text-xs" data-category="Cemilan">Cemilan</button>
                        <button onclick="setCategoryFilter('Minuman')" class="category-tab px-4 py-2 bg-zinc-800 rounded-2xl text-xs" data-category="Minuman">Minuman</button>
                        <button onclick="setCategoryFilter('Lainnya')" class="category-tab px-4 py-2 bg-zinc-800 rounded-2xl text-xs" data-category="Lainnya">Lainnya</button>
                    </div>

                    <div id="product-list" class="space-y-2 max-h-[320px] overflow-auto pr-2">
                        <!-- Products populated by JS -->
                    </div>
                </div>

                <!-- Cart -->
                <div class="lg:col-span-7 bg-zinc-900 rounded-3xl border border-zinc-800 p-4 sm:p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-semibold text-lg">Keranjang</h2>
                        <button onclick="clearCart()" class="text-sm text-red-400 hover:text-red-500">Kosongkan</button>
                    </div>

                    <div id="cart-list" class="space-y-2 min-h-[200px] max-h-[280px] overflow-auto mb-4">
                        <!-- Cart items -->
                    </div>

                    <div class="border-t border-zinc-700 pt-4">
                        <div class="flex justify-between text-lg font-bold mb-4">
                            <span>Total</span>
                            <span id="cart-total">Rp 0</span>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="showPaymentModal()" class="py-3.5 bg-[#800000] hover:bg-[#600000] rounded-2xl font-semibold">
                                <i class="fa-solid fa-credit-card mr-2"></i>Bayar
                            </button>
                            <button onclick="clearCart()" class="py-3.5 bg-zinc-800 hover:bg-zinc-700 rounded-2xl font-semibold">
                                Batal
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-zinc-900 rounded-3xl w-full max-w-md border border-zinc-800 p-6 mx-4">
            <h3 class="font-semibold text-xl mb-4" id="modal-title">Tambah Produk</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-sm text-zinc-400">Nama Produk</label>
                    <input type="text" id="product-name" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 mt-1">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm text-zinc-400">Harga (Rp)</label>
                        <input type="number" id="product-price" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 mt-1">
                    </div>
                    <div>
                        <label class="text-sm text-zinc-400">Stok</label>
                        <input type="number" id="product-stock" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 mt-1">
                    </div>
                </div>
                <div>
                    <label class="text-sm text-zinc-400">Kategori</label>
                    <select id="product-category" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 mt-1">
                        <option value="Makanan">Makanan</option>
                        <option value="Cemilan">Cemilan</option>
                        <option value="Minuman">Minuman</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="hideProductModal()" class="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl">Batal</button>
                <button onclick="saveProduct()" class="flex-1 py-3 bg-[#800000] hover:bg-[#600000] rounded-2xl">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-zinc-900 rounded-3xl w-full max-w-md border border-zinc-800 p-6 mx-4">
            <h3 class="font-semibold text-xl mb-4">Pembayaran</h3>
            
            <div class="text-center mb-6">
                <div class="text-zinc-400">Total Belanja</div>
                <div id="payment-total" class="text-4xl font-bold text-[#b91c1c] mt-1">Rp 0</div>
            </div>

            <!-- Customer & Kasir -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="text-sm text-zinc-400">Nama Customer</label>
                    <input type="text" id="customer-name" placeholder="Walk-in" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 mt-1 text-sm" onkeydown="if(event.key==='Enter')document.getElementById('customer-wa').focus()">
                </div>
                <div>
                    <label class="text-sm text-zinc-400">Kasir</label>
                    <input type="text" id="kasir-name" readonly class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 mt-1 text-sm text-zinc-400">
                </div>
            </div>
            <div class="mb-4">
                <label class="text-sm text-zinc-400">No. WhatsApp Customer (opsional)</label>
                <input type="tel" id="customer-wa" placeholder="08xx-xxxx-xxxx" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 mt-1 text-sm" onkeydown="if(event.key==='Enter')document.getElementById('cash-amount').focus()">
            </div>

            <div class="mb-4">
                <label class="text-sm text-zinc-400">Metode Pembayaran</label>
                <div class="grid grid-cols-3 gap-2 mt-2">
                    <button onclick="selectPaymentMethod('cash')" id="method-cash" class="py-2 rounded-xl border border-zinc-700 bg-zinc-800 hover:border-[#800000] text-sm">Cash</button>
                    <button onclick="selectPaymentMethod('qris')" id="method-qris" class="py-2 rounded-xl border border-zinc-700 bg-zinc-800 hover:border-[#800000] text-sm">QRIS</button>
                    <button onclick="selectPaymentMethod('transfer')" id="method-transfer" class="py-2 rounded-xl border border-zinc-700 bg-zinc-800 hover:border-[#800000] text-sm">Transfer</button>
                </div>
            </div>

            <div id="cash-section">
                <label class="text-sm text-zinc-400">Uang Tunai</label>
                <input type="number" id="cash-amount" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-4 py-3 mt-1 text-2xl text-center" oninput="calculateChange()">
                
                <div class="flex justify-between mt-4 text-lg">
                    <span class="text-zinc-400">Kembalian</span>
                    <span id="change-amount" class="font-bold text-[#b91c1c]">Rp 0</span>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="hidePaymentModal()" class="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl">Batal</button>
                <button onclick="confirmPayment()" class="flex-1 py-3 bg-[#800000] hover:bg-[#600000] rounded-2xl font-semibold">Konfirmasi</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-zinc-900 rounded-3xl w-full max-w-sm border border-zinc-800 p-6 mx-4 text-center">
            <div class="w-16 h-16 bg-[#991b1b]/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-check text-[#b91c1c] text-3xl"></i>
            </div>
            <h3 class="font-semibold text-xl mb-2">Konfirmasi Pembayaran</h3>
            <p class="text-zinc-400 mb-1">Total: <span id="confirm-total" class="text-white font-bold">Rp 0</span></p>
            <p class="text-zinc-400 mb-1">Metode: <span id="confirm-method" class="text-white font-bold">Cash</span></p>
            <p id="confirm-change-text" class="text-zinc-400 mb-6">Kembalian: <span id="confirm-change" class="text-[#b91c1c] font-bold">Rp 0</span></p>
            
            <div class="flex gap-3">
                <button onclick="hideConfirmModal()" class="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl">Batal</button>
                <button onclick="finishPayment()" class="flex-1 py-3 bg-[#800000] hover:bg-[#600000] rounded-2xl font-semibold">Selesai</button>
            </div>
        </div>
    </div>

    <!-- Receipt Modal -->
    <div id="receipt-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex flex-col items-center justify-start overflow-auto py-4">
        <div id="receipt-content" class="bg-white text-black mx-4 font-mono text-[13px] leading-tight flex-shrink-0" style="width:80mm;max-width:320px;padding:8px;">
            <!-- Receipt content injected by JS -->
        </div>
        <div class="flex flex-wrap gap-2 justify-center mt-4 px-4 pb-4 flex-shrink-0">
            <button onclick="printReceipt()" class="px-4 py-2 bg-[#800000] text-white rounded-2xl text-sm"><i class="fa-solid fa-print mr-1"></i>Print</button>
            <button onclick="downloadPdf()" class="px-4 py-2 bg-zinc-700 text-white rounded-2xl text-sm"><i class="fa-solid fa-download mr-1"></i>PDF</button>
            <button id="send-wa-btn" onclick="sendReceiptToWA()" class="px-4 py-2 bg-green-500 text-white rounded-2xl text-sm"><i class="fa-brands fa-whatsapp mr-1"></i>Kirim WA</button>
            <button onclick="hideReceiptModal()" class="px-4 py-2 bg-zinc-800 text-white rounded-2xl text-sm">Tutup</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAnnCmMT3vV-7Qx9HR3ww1sZ7h_MVh6geo",
            authDomain: "pos-warung-salem.firebaseapp.com",
            projectId: "pos-warung-salem",
            storageBucket: "pos-warung-salem.firebasestorage.app",
            messagingSenderId: "85046866660",
            appId: "1:85046866660:web:39960723ef60b288db72f1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let products = [];
        let cart = [];
        let currentFilter = 'all';
        let editingProductId = null;
        let selectedPaymentMethod = 'cash';
        let todayStats = { transactions: 0, revenue: 0 };

        // Escape HTML — pencegahan stored XSS dari data Firestore
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Store config (centralized, no external file needed)
        const CONFIG = {
            storeName: 'Warung Salem',
            storeJargon: 'Beuteng wareg awak jagjag',
            storeAddress: 'Jl. Tegal Mulya, Gerbang Belakang Kampus UMP\nLedug, Kembaran, Purwokerto',
            storeHours: 'Jam Buka: Setiap Hari 10.00 - 21.00 WIB',
            storeWA: '0823-2555-5586',
            storeIG: '@warung_salem',
            storeWebsite: 'warungsalem.web.id',
            receipt: { width: 80 }
        };

        // Auth check
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                currentUser = user;
                document.getElementById('admin-name').textContent = user.email.split('@')[0];
                loadProducts();
                loadTodayStats();
            }
        });

        function logout() {
            auth.signOut().then(() => window.location.href = 'login.html');
        }

        // Load products from Firestore
        function loadProducts() {
            db.collection('products').onSnapshot(snapshot => {
                products = [];
                snapshot.forEach(doc => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                renderProducts();
                updateStats();
            });
        }

        function renderProducts(filteredProducts = null) {
            const container = document.getElementById('product-list');
            container.innerHTML = '';

            let list = filteredProducts || products;
            
            if (currentFilter !== 'all') {
                list = list.filter(p => p.category === currentFilter);
            }

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center text-zinc-500 py-8">Tidak ada produk</div>`;
                return;
            }

            list.forEach(product => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-3 bg-zinc-950 rounded-2xl border border-zinc-800 hover:border-[#800000]';
                div.innerHTML = `
                    <div class="flex-1 cursor-pointer" onclick="addToCart('${product.id}')">
                        <div class="font-medium">${esc(product.name)}</div>
                        <div class="text-xs text-zinc-400">${esc(product.category)} • Stok: <span class="${product.stock >= 5 ? 'text-[#b91c1c]' : 'text-red-400'}">${product.stock}</span></div>
                        <div class="font-semibold text-[#b91c1c]">Rp ${product.price.toLocaleString('id-ID')}</div>
                    </div>
                    <div class="flex gap-2 ml-2">
                        <button onclick="event.stopPropagation(); showProductModal(products.find(p=>p.id==='${product.id}'))" 
                                class="w-8 h-8 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-xs flex items-center justify-center">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="event.stopPropagation(); deleteProduct('${product.id}')" 
                                class="w-8 h-8 bg-red-600/80 hover:bg-red-600 rounded-lg text-xs flex items-center justify-center">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        <button onclick="event.stopPropagation(); addToCart('${product.id}')" 
                                class="w-8 h-8 bg-[#800000] hover:bg-[#600000] rounded-lg text-xs flex items-center justify-center">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterProducts() {
            const q = document.getElementById('search-product').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(q));
            renderProducts(filtered);
        }

        function setCategoryFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-tab').forEach(el => {
                el.classList.toggle('bg-[#800000]', el.dataset.category === cat);
                el.classList.toggle('bg-zinc-800', el.dataset.category !== cat);
            });
            renderProducts();
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product || product.stock <= 0) return alert('Stok habis');

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                if (existing.qty >= product.stock) return alert(`Stok ${esc(product.name)} tersisa ${product.stock}`);
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-list');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-zinc-500 py-8">Keranjang kosong</div>`;
                document.getElementById('cart-total').textContent = 'Rp 0';
                return;
            }

            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-3 bg-zinc-950 rounded-2xl';
                div.innerHTML = `
                    <div>
                        <div class="font-medium">${esc(item.name)}</div>
                        <div class="text-xs text-zinc-400">Rp ${item.price.toLocaleString('id-ID')} × ${item.qty}</div>
                    </div>
                    <div class="flex items-center gap-x-3">
                        <div class="font-semibold">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</div>
                        <div class="flex gap-1">
                            <button onclick="changeQty(${index}, -1)" class="w-6 h-6 bg-zinc-800 rounded">-</button>
                            <button onclick="changeQty(${index}, 1)" class="w-6 h-6 bg-zinc-800 rounded">+</button>
                            <button onclick="removeFromCart(${index})" class="w-6 h-6 text-red-400"><i class="fa-solid fa-times"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
            document.getElementById('cart-total').textContent = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function changeQty(index, delta) {
            const item = cart[index];
            const product = products.find(p => p.id === item.id);
            const newQty = item.qty + delta;
            if (newQty < 1) { removeFromCart(index); return; }
            if (product && newQty > product.stock) {
                alert(`Stok ${esc(product.name)} tersisa ${product.stock}`);
                return;
            }
            item.qty = newQty;
            renderCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function showProductModal(product = null) {
            editingProductId = product ? product.id : null;
            document.getElementById('modal-title').textContent = product ? 'Edit Produk' : 'Tambah Produk';
            
            if (product) {
                document.getElementById('product-name').value = product.name;
                document.getElementById('product-price').value = product.price;
                document.getElementById('product-stock').value = product.stock;
                document.getElementById('product-category').value = product.category;
            } else {
                document.getElementById('product-name').value = '';
                document.getElementById('product-price').value = '';
                document.getElementById('product-stock').value = '';
                document.getElementById('product-category').value = 'Makanan';
            }
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function hideProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function saveProduct() {
            const name = document.getElementById('product-name').value.trim();
            const price = parseInt(document.getElementById('product-price').value);
            const stock = parseInt(document.getElementById('product-stock').value);
            const category = document.getElementById('product-category').value;

            if (!name || name.length > 100) return alert('Nama produk wajib diisi (maks 100 karakter)');
            if (isNaN(price) || price < 0 || price > 99999999) return alert('Harga tidak valid (0-99.999.999)');
            if (isNaN(stock) || stock < 0 || stock > 99999) return alert('Stok tidak valid (0-99.999)');
            if (!['Makanan','Cemilan','Minuman','Lainnya'].includes(category)) return alert('Kategori tidak valid');

            const data = { name, price, stock, category };

            if (editingProductId) {
                db.collection('products').doc(editingProductId).update(data);
            } else {
                db.collection('products').add(data);
            }
            hideProductModal();
        }

        async function deleteProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            if (!confirm(`Hapus "${product.name}"?\n\nProduk akan dihapus permanen dari daftar.`)) return;
            try {
                await db.collection('products').doc(productId).delete();
            } catch (err) {
                alert('Gagal menghapus: ' + err.message);
            }
        }

            document.querySelectorAll('[id^="method-"]').forEach(btn => {
                btn.classList.remove('border-[#800000]', 'bg-[#4a0000]/30');
            });
            const active = document.getElementById(`method-${method}`);
            active.classList.add('border-[#800000]', 'bg-[#4a0000]/30');

            const cashSection = document.getElementById('cash-section');

        function showPaymentModal() {
            if (cart.length === 0) return;
            const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            document.getElementById('payment-total').textContent = `Rp ${total.toLocaleString('id-ID')}`;
            document.getElementById('cash-amount').value = '';
            document.getElementById('change-amount').textContent = 'Rp 0';
            document.getElementById('customer-name').value = '';
            document.getElementById('customer-wa').value = '';
            document.getElementById('kasir-name').value = currentUser ? currentUser.email : 'admin';
            document.getElementById('payment-modal').classList.remove('hidden');
            selectPaymentMethod('cash');
            document.getElementById('customer-name').focus();
        }

        function hidePaymentModal() {
            document.getElementById('payment-modal').classList.add('hidden');
        }

        function calculateChange() {
            const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            const cash = parseInt(document.getElementById('cash-amount').value) || 0;
            const change = Math.max(0, cash - total);
            
            const changeEl = document.getElementById('change-amount');
            if (cash >= total) {
                changeEl.className = 'font-bold text-[#b91c1c]';
                changeEl.textContent = `Rp ${change.toLocaleString('id-ID')}`;
            } else {
                const kurang = total - cash;
                changeEl.className = 'font-bold text-red-400';
                changeEl.textContent = `Kurang Rp ${kurang.toLocaleString('id-ID')}`;
            }
        }

        function confirmPayment() {
            if (cart.length === 0) return;

            const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            
            if (selectedPaymentMethod === 'cash') {
                const cash = parseInt(document.getElementById('cash-amount').value) || 0;
                if (cash < total) {
                    const kurang = total - cash;
                    alert(`⚠️ Uang kurang!\n\nTotal: Rp ${total.toLocaleString('id-ID')}\nBayar: Rp ${cash.toLocaleString('id-ID')}\nKurang: Rp ${kurang.toLocaleString('id-ID')}\n\nSilakan tambah nominal.`);
                    return;
                }
            }

            // Show confirm modal
            document.getElementById('confirm-total').textContent = `Rp ${total.toLocaleString('id-ID')}`;
            document.getElementById('confirm-method').textContent = 
                selectedPaymentMethod === 'cash' ? 'Cash' : 
                selectedPaymentMethod === 'qris' ? 'QRIS' : 'Transfer';
            
            const changeText = document.getElementById('confirm-change-text');
            if (selectedPaymentMethod === 'cash') {
                const cash = parseInt(document.getElementById('cash-amount').value) || 0;
                const change = cash - total;
                changeText.classList.remove('hidden');
                document.getElementById('confirm-change').textContent = `Rp ${change.toLocaleString('id-ID')}`;
            } else {
                changeText.classList.add('hidden');
            }

            hidePaymentModal();
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function hideConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        async function finishPayment() {
            const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            let cash = 0;
            let change = 0;

            if (selectedPaymentMethod === 'cash') {
                cash = parseInt(document.getElementById('cash-amount').value) || 0;
                change = cash - total;
            }

            try {
                // Count this year's transactions for receipt seq (resets Jan 1)
                const yearStart = new Date(new Date().getFullYear(), 0, 1);
                const yearEnd = new Date(new Date().getFullYear() + 1, 0, 1);
                
                const yearSnap = await db.collection('transactions')
                    .where('createdAt', '>=', yearStart.getTime())
                    .where('createdAt', '<', yearEnd.getTime())
                    .get();
                const receiptSeq = yearSnap.size + 1;

                // Use server timestamp for Firestore
                const now = firebase.firestore.FieldValue.serverTimestamp();
                
                const transaction = {
                    items: cart.map(item => ({
                        name: item.name,
                        price: item.price,
                        qty: item.qty,
                        subtotal: item.price * item.qty
                    })),
                    total,
                    cash,
                    change,
                    method: selectedPaymentMethod,
                    customerName: document.getElementById('customer-name').value || 'Walk-in',
                    customerWA: document.getElementById('customer-wa').value || '',
                    kasirName: currentUser?.email || 'admin',
                    timestamp: now,
                    receiptSeq,
                    createdAt: Date.now(),
                    createdBy: currentUser.email
                };

                await db.collection('transactions').add(transaction);

                // Save/update customer to database
                const waInput = document.getElementById('customer-wa').value.trim();
                const nameInput = document.getElementById('customer-name').value.trim();
                if (waInput) {
                    // Check if customer exists by WA
                    const custSnap = await db.collection('customers')
                        .where('wa', '==', waInput)
                        .limit(1)
                        .get();
                    if (custSnap.empty) {
                        await db.collection('customers').add({
                            name: nameInput || 'Walk-in',
                            wa: waInput,
                            totalSpent: total,
                            visitCount: 1,
                            createdAt: Date.now()
                        });
                    } else {
                        const custDoc = custSnap.docs[0];
                        await custDoc.ref.update({
                            name: nameInput || custDoc.data().name,
                            totalSpent: firebase.firestore.FieldValue.increment(total),
                            visitCount: firebase.firestore.FieldValue.increment(1),
                            lastVisit: Date.now()
                        });
                    }
                }

                // Update stock (batch write for atomicity)
                const batch = db.batch();
                for (const item of cart) {
                    const ref = db.collection('products').doc(item.id);
                    batch.update(ref, { stock: firebase.firestore.FieldValue.increment(-item.qty) });
                }
                await batch.commit();

                hideConfirmModal();
                showReceipt(transaction);
                cart = [];
                renderCart();
            } catch (err) {
                alert('Gagal menyimpan transaksi: ' + err.message);
            }
        }

        function downloadPdf() {
            const t = window._lastReceiptData;
            const w = CONFIG.receipt.width || 80;
            const filename = `${window._lastReceiptNo || 'receipt'}.pdf`;

            // Primary: jsPDF text-based (works on all devices, no canvas dependency)
            const doc = buildTextReceipt(t, w);
            if (doc) {
                // Mobile: use blob + download link (avoid popup blockers)
                try {
                    const blob = doc.output('blob');
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
                } catch (_) {
                    doc.save(filename);
                }
                return;
            }

            // Fallback: html2pdf (desktop only, may fail in PWA)
            const element = document.getElementById('receipt-content');
            if (typeof html2pdf === 'undefined') { alert('PDF library belum ready, coba lagi'); return; }
            const opt = {
                margin: 0,
                filename,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    allowTaint: true,
                    scrollX: 0,
                    scrollY: 0,
                    windowWidth: Math.max(400, element.scrollWidth || 400)
                },
                jsPDF: { unit: 'mm', format: [w, 200] }
            };
            html2pdf().set(opt).from(element).save().catch(() => {
                alert('Gagal download PDF. Coba gunakan Print.');
            });
        }

        function buildTextReceipt(t, w) {
            if (!t) return null;
            try {
                const jspdfLib = window.jspdf || window.jsPDF;
                if (!jspdfLib) return null;
                const { jsPDF } = jspdfLib.jsPDF ? jspdfLib : { jsPDF: jspdfLib };
                if (!jsPDF) return null;

                const ts = (t.createdAt && typeof t.createdAt === 'number') ? new Date(t.createdAt) :
                           (t.timestamp && t.timestamp?.toDate) ? new Date(t.timestamp.toDate()) : new Date();
                const dd = String(ts.getDate()).padStart(2, '0');
                const MM = String(ts.getMonth() + 1).padStart(2, '0');
                const yy = String(ts.getFullYear()).slice(-2);
                const timeStr = ts.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const dateStr = `${dd}/${MM}/${yy}`;
                const seq = String(t.receiptSeq || 1).padStart(6, '0');
                const receiptNo = `POS-${dd}${MM}${yy}-${seq}`;
                const methodLabel = t.method === 'cash' ? 'CASH' : t.method === 'qris' ? 'QRIS' : 'TRANSFER';

                const itemCount = (t.items || []).length;
                const estimatedHeight = 70 + (itemCount * 12) + 40;
                const doc = new jsPDF({ unit: 'mm', format: [w, Math.max(estimatedHeight, 100)], orientation: 'portrait' });

                const mg = 4, cx = w / 2, right = w - mg;
                let y = 6, lh = 4.2;
                const sep = '\u2550'.repeat(Math.floor((w - 8) / 2.2));
                const thinSep = '\u2500'.repeat(Math.floor((w - 8) / 2.2));

                // ── HEADER ──
                doc.setFont('Helvetica', 'bold');
                doc.setFontSize(14);
                doc.text((CONFIG.storeName || 'STORE').toUpperCase(), cx, y, { align: 'center' }); y += 5.5;
                doc.setFont('Helvetica', 'italic');
                doc.setFontSize(7);
                doc.text(`"${CONFIG.storeJargon || ''}"`, cx, y, { align: 'center' }); y += lh + 1;
                doc.setFont('Helvetica', 'normal');
                doc.setFontSize(7);
                doc.text(dateStr + '  ' + timeStr, cx, y, { align: 'center' }); y += lh;
                doc.text(receiptNo, cx, y, { align: 'center' }); y += lh + 2;

                // ── DOUBLE LINE ──
                doc.setFontSize(7);
                doc.text(sep, mg, y); y += lh + 1;

                // ── CUSTOMER & KASIR ──
                doc.setFont('Helvetica', 'normal');
                doc.setFontSize(7.5);
                doc.text('Customer', mg, y);
                doc.text(t.customerName || 'Walk-in', right, y, { align: 'right' }); y += lh;
                doc.text('Kasir', mg, y);
                doc.text(t.kasirName || 'admin', right, y, { align: 'right' }); y += lh + 1;

                // ── THIN LINE ──
                doc.text(thinSep, mg, y); y += lh + 1;

                // ── ITEMS ──
                doc.setFontSize(7.5);
                (t.items || []).forEach(item => {
                    const name = (item.name || '').substring(0, 22);
                    const qty = item.qty || 1;
                    const price = item.price || 0;
                    const sub = item.subtotal || (price * qty);
                    // Name + qty left, price right
                    doc.setFont('Courier', 'bold');
                    doc.text(name, mg, y);
                    doc.setFont('Helvetica', 'normal');
                    doc.text(qty + 'x', mg + name.length * 2.1 + 2, y);
                    doc.text('Rp' + sub.toLocaleString('id-ID'), right, y, { align: 'right' });
                    y += lh;
                    // Unit price detail
                    doc.setFontSize(6.5);
                    doc.text('  @ Rp' + price.toLocaleString('id-ID'), mg + 2, y);
                    doc.setFontSize(7.5);
                    y += lh + 0.5;
                });

                // ── DOUBLE LINE ──
                doc.text(sep, mg, y); y += lh + 2;

                // ── TOTAL ──
                doc.setFont('Courier', 'bold');
                doc.setFontSize(10);
                doc.text('TOTAL', mg, y);
                doc.text('Rp' + (t.total || 0).toLocaleString('id-ID'), right, y, { align: 'right' });
                y += lh + 2;

                // ── PAYMENT INFO ──
                doc.setFont('Helvetica', 'normal');
                doc.setFontSize(7.5);
                doc.text('Metode', mg, y);
                doc.text(methodLabel, right, y, { align: 'right' }); y += lh;
                if (t.method === 'cash') {
                    doc.text('Tunai', mg, y);
                    doc.text('Rp' + (t.cash || 0).toLocaleString('id-ID'), right, y, { align: 'right' }); y += lh;
                    doc.text('Kembali', mg, y);
                    doc.text('Rp' + (t.change || 0).toLocaleString('id-ID'), right, y, { align: 'right' }); y += lh;
                }

                // ── THIN LINE ──
                y += 1;
                doc.text(thinSep, mg, y); y += lh + 2;

                // ── FOOTER ──
                doc.setFont('Courier', 'bold');
                doc.setFontSize(8);
                doc.text('Terima Kasih', cx, y, { align: 'center' }); y += lh + 1;
                doc.setFont('Helvetica', 'normal');
                doc.setFontSize(6);
                const addrLines = (CONFIG.storeAddress || '').split('\n');
                addrLines.forEach(line => { doc.text(line.trim(), cx, y, { align: 'center' }); y += 3.2; });
                doc.text(CONFIG.storeHours || '', cx, y, { align: 'center' }); y += 3.2;
                doc.text('WA: ' + (CONFIG.storeWA || ''), cx, y, { align: 'center' }); y += 3.2;
                doc.text(CONFIG.storeIG || '', cx, y, { align: 'center' }); y += 3.2;
                doc.text(CONFIG.storeWebsite || '', cx, y, { align: 'center' });

                return doc;
            } catch (e) { return null; }
        }

            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function loadTodayStats() {
            if (!currentUser) return;
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            try {
                const snapshot = await db.collection('transactions')
                    .where('timestamp', '>=', today)
                    .where('timestamp', '<', tomorrow)
                    .get();

                todayStats = { transactions: 0, revenue: 0 };
                snapshot.forEach(doc => {
                    todayStats.transactions++;
                    todayStats.revenue += doc.data().total || 0;
                });

                document.getElementById('today-transactions').textContent = todayStats.transactions;
                document.getElementById('today-revenue').textContent = `Rp ${todayStats.revenue.toLocaleString('id-ID')}`;
            } catch (err) {
                console.error('Error loading today stats:', err);
            }
        }

        function updateStats() {
            document.getElementById('total-products').textContent = products.length;
            
            const lowStock = products.filter(p => p.stock < 5);
            document.getElementById('low-stock').textContent = lowStock.length;
            
            // Low stock item list
            const listEl = document.getElementById('low-stock-list');
            listEl.innerHTML = '';
            if (lowStock.length === 0) {
                const div = document.createElement('div');
                div.className = 'text-[#b91c1c] text-xs text-center';
                div.textContent = '✓ Semua stok aman';
                listEl.appendChild(div);
            } else {
                lowStock.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center';
                    div.innerHTML = `
                        <span>${esc(p.name)}</span>
                        <span class="px-1.5 py-0.5 bg-[#991b1b]/20 text-[#b91c1c] rounded">${p.stock}</span>
                    `;
                    listEl.appendChild(div);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('search-product').focus();
        });
    </script>
</body>
</html>
